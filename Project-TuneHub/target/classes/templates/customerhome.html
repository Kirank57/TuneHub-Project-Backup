<!DOCTYPE html>
<html lang="en" xmlns:th="https://thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Page</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/customerhome.css}" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="list">
        <a><i class="fa fa-user icon"></i> <b th:text="${user.username}" style="text-decoration: none;"></b></a>
        <a>About</a>
        <a><button type="button" class="btn btn-outline-light"><i class="fa fa-phone"></i> Contact</button></a>
        <a href="index"><button type="button" class="btn btn-outline-light"><i class="fa fa-home"></i> Home</button></a>
        <a href="logout"><button type="button" class="btn btn-outline-light">Logout</button></a>
      </div>
    </nav>
    <div th:unless="${ispremium}" class="non-premium">
     <div class="container">
        <form action="pay">
          <button type="submit" class="btn btn-primary me-2" id="btn1">Get Premium</button>
        </form>
        <form action="logout">
          <button type="submit" class="btn btn-primary me-2" id="btn2">Logout</button>
        </form>
        </div>
     </div>
    <div  th:if="${ispremium}" class="premium">
       <section class="reasons-to-join">
        <div class="cards-container" >
          <div class="card" th:each="song :${song}">
          <img src="/images/ph1.jpg" alt="TV Icon" />
          <h3 th:text="${song.name}"></h3>
          <p th:text="${song.genre}"></p>
          <h3 th:text="${song.artist}"></h3>
          <audio
            id="audio-element"
            style="width: 300px; margin-top: 5px" 
            controls
          >
            <source th:src="${song.link}" type="audio/mpeg" /></audio
          ><br />
        </div>
      </div>
    </section>
    </div>
    <footer>
      <div class="footer">
        <p>Developed By Kiran</p>
      </div>
    </footer>
  </body>
</html>

</html>
